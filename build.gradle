plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = 'Sus_InstantSwap-2.0.0-Fabric1.20' }

repositories {
    maven { url "https://api.modrinth.com/maven" }
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/client/resources/susinstantswap.accesswidener")
    mods {
        "susinstantswap" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

processClientResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveVersion = ''
    from("LICENSE") {
        rename { "${it}_Sus_InstantSwap" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) { from components.java }
    }
    repositories {}
}
